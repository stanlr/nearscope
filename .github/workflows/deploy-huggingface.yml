name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NearScope
        run: npm run build

      - name: Prepare static files (prebuilt outside Hugging Face)
        run: |
          cp -R dist /tmp/nearscope-dist
          rm -rf node_modules dist
          git switch -c hf-deploy
          git rm -rf .
          cp -R /tmp/nearscope-dist/. .
          cat > README.md <<'EOF'
          ---
          title: NearScope
          emoji: 🌐
          colorFrom: blue
          colorTo: green
          sdk: static
          app_file: index.html
          pinned: false
          ---

          NearScope — a read-only live dashboard for NEAR Protocol mainnet.
          EOF
          git add -f .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy prebuilt NearScope static site"

      - name: Push prebuilt static site to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing HF_TOKEN. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          git config --global credential.helper store
          printf 'https://sopuruchukwu:%s@huggingface.co\n' "$HF_TOKEN" > ~/.git-credentials
          git remote add huggingface https://huggingface.co/spaces/sopuruchukwu/nearscope
          git push --force huggingface hf-deploy:main
